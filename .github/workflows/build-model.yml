name: Build OpenSCAD model

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  TOOLCHAIN_IMAGE: ghcr.io/${{ github.repository_owner }}/hardware-devops-toolchain:2.9.5

jobs:
  build-model:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Linux toolchain image
        uses: docker/build-push-action@v6
        with:
          context: ./toolchain
          file: ./toolchain/Dockerfile
          load: true
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/hardware-devops-toolchain:2.9.5
            ghcr.io/${{ github.repository_owner }}/hardware-devops-toolchain:latest

      - name: Validate toolchain contract
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$TOOLCHAIN_IMAGE" \
            bash -lc '
              set -euxo pipefail
              prusa-slicer --version
              openscad --version
              prusa-slicer --help > /tmp/prusa-help.txt
              grep -E -q -- "--printer-profile|--print-profile|--material-profile" /tmp/prusa-help.txt
            '

      - name: Run canonical build pipeline in toolchain container
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$TOOLCHAIN_IMAGE" \
            bash scripts/build-model.sh

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-copilot-display-stand-artifacts
          path: |
            artifacts/
            reports/
          if-no-files-found: error
