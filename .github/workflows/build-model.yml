name: Build OpenSCAD model

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-model:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenSCAD and PrusaSlicer
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            openscad \
            ca-certificates \
            curl \
            gnupg \
            libfuse2 \
            snapd

          # Do not use the Flatpak path here. The build is intentionally repo-managed and must
          # run against the repository-configured vendor profile without depending on user-specific
          # config trees or GUI bootstrap state.
          sudo systemctl enable --now snapd
          sudo snap wait system seed.loaded

          # Install the official Ubuntu Snap package so prusa-slicer is on PATH as a normal CLI.
          sudo snap install prusa-slicer --classic

          if openscad --version >/dev/null 2>&1; then
            openscad --version
          else
            openscad -v
          fi

          if prusa-slicer --version >/dev/null 2>&1; then
            prusa-slicer --version
          else
            prusa-slicer --help 2>&1 | head -n 20
          fi

          prusa-slicer --help 2>&1 | grep -E -- '--printer-profile|--print-profile|--material-profile'

      - name: Run canonical build pipeline
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/build-model.sh

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-copilot-display-stand-artifacts
          path: |
            artifacts/
            reports/
          if-no-files-found: error
