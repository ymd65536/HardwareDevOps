name: Build OpenSCAD model

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-model:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenSCAD
        run: |
          brew install openscad

      - name: Install PrusaSlicer
        run: |
          brew install --cask prusaslicer

      - name: Build model and manufacturing artifacts
        run: |
          set -e
          bash scripts/build-model.sh

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-copilot-display-stand-artifacts
          path: |
            artifacts/
            reports/
          if-no-files-found: error
