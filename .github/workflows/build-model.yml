name: Build OpenSCAD model

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-model:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenSCAD and PrusaSlicer
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            openscad \
            ca-certificates \
            curl \
            flatpak \
            gnupg \
            libfuse2

          # The previous PackageCloud repository used by older instructions is no longer valid.
          # Prusa3D's current official Linux distribution path is Flathub, which is the supported
          # route for a modern 2.9.x CLI that exposes --printer-profile / --print-profile / --material-profile.
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub com.prusa3d.PrusaSlicer

          sudo tee /usr/local/bin/prusa-slicer >/dev/null <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec flatpak run --command=prusa-slicer com.prusa3d.PrusaSlicer "$@"
          EOF
          sudo chmod +x /usr/local/bin/prusa-slicer

          if openscad --version >/dev/null 2>&1; then
            openscad --version
          else
            openscad -v
          fi

          if prusa-slicer --version >/dev/null 2>&1; then
            prusa-slicer --version
          else
            prusa-slicer --help 2>&1 | head -n 20
          fi

          prusa-slicer --help 2>&1 | grep -E -- '--printer-profile|--print-profile|--material-profile'

      - name: Run canonical build pipeline
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/build-model.sh

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-copilot-display-stand-artifacts
          path: |
            artifacts/
            reports/
          if-no-files-found: error
