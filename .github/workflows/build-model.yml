name: Build OpenSCAD model

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-model:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenSCAD and PrusaSlicer
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            openscad \
            ca-certificates \
            curl \
            gnupg \
            libfuse2

          # Ubuntu's default repository is too old for the CLI options used by this project.
          # Use the official Prusa3D package source to ensure a supported 2.8+ CLI that recognizes
          # --printer-profile / --print-profile / --material-profile.
          curl -fsSL https://packagecloud.io/prusa3d/PrusaSlicer/gpgkey | \
            sudo gpg --dearmor -o /usr/share/keyrings/prusa3d-prusaslicer.gpg

          echo "deb [signed-by=/usr/share/keyrings/prusa3d-prusaslicer.gpg] https://packagecloud.io/prusa3d/PrusaSlicer/ubuntu/ $(. /etc/os-release; echo "$VERSION_CODENAME") main" | \
            sudo tee /etc/apt/sources.list.d/prusa3d-prusaslicer.list

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends prusa-slicer

          if openscad --version >/dev/null 2>&1; then
            openscad --version
          else
            openscad -v
          fi

          if prusa-slicer --version >/dev/null 2>&1; then
            prusa-slicer --version
          else
            prusa-slicer --help 2>&1 | head -n 20
          fi

      - name: Run canonical build pipeline
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/build-model.sh

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-copilot-display-stand-artifacts
          path: |
            artifacts/
            reports/
          if-no-files-found: error
