name: Manufacturing toolchain and model build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  TOOLCHAIN_IMAGE: ghcr.io/${{ github.repository_owner }}/hardware-devops-toolchain:2.9.5

jobs:
  toolchain-build:
    name: Toolchain build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Linux toolchain image
        uses: docker/build-push-action@v6
        with:
          context: ./toolchain
          file: ./toolchain/Dockerfile
          platforms: linux/amd64
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/hardware-devops-toolchain:2.9.5
            ghcr.io/${{ github.repository_owner }}/hardware-devops-toolchain:latest
          cache-from: |
            type=gha
          cache-to: |
            type=gha,mode=max

      - name: Validate toolchain contract
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$TOOLCHAIN_IMAGE" \
            bash -lc '
              set -euxo pipefail
              openscad --version
              bambu-studio --help > /tmp/bambu-help.txt 2>&1 || true
              grep -E -q -- "--slice|--outputdir" /tmp/bambu-help.txt
            '

  model-build:
    name: Model build
    needs: toolchain-build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pinned Linux toolchain image
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform linux/amd64 "$TOOLCHAIN_IMAGE"

      - name: Run canonical model build in toolchain container
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$TOOLCHAIN_IMAGE" \
            bash scripts/build-model.sh

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-copilot-display-stand-artifacts
          path: |
            artifacts/
            reports/
          if-no-files-found: error
