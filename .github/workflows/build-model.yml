name: Build OpenSCAD model

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-model:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenSCAD
        run: |
          brew install openscad

      - name: Install PrusaSlicer
        run: |
          set -e
          brew install --cask prusaslicer
          echo "$(dirname "$(command -v prusa-slicer)")" >> "$GITHUB_PATH"

      - name: Validate design parameters
        run: |
          set -e
          python3 scripts/validate-stand.py

      - name: Create artifact directories
        run: |
          mkdir -p artifacts reports

      - name: Generate STL
        run: |
          set -e
          openscad -o artifacts/copilot-stand.stl src/copilot-stand.scad

      - name: Generate PNG preview
        run: |
          set -e
          openscad -o artifacts/copilot-stand.png --imgsize=1600,1200 src/copilot-stand.scad

      - name: Slice STL with PrusaSlicer
        run: |
          set -e
          PRUSA_SLICER_BIN="$(command -v prusa-slicer)"
          "$PRUSA_SLICER_BIN" \
            --ignore-nonexistent-config \
            --load profiles/vendor/HardwareDevOps.ini \
            --output artifacts/copilot-stand.gcode \
            --export-gcode \
            --printer-profile "Home FDM" \
            --print-profile "0.20mm Standard @Home FDM" \
            --material-profile "Generic PLA @Home FDM" \
            artifacts/copilot-stand.stl

      - name: Generate manufacturing report
        run: |
          set -e
          python3 scripts/generate-manufacturing-report.py --input artifacts/copilot-stand.gcode --output reports/copilot-stand-report.json

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-copilot-display-stand-artifacts
          path: |
            artifacts/
            reports/
          if-no-files-found: error
