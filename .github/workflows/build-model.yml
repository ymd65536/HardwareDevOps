name: Build OpenSCAD model

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-model:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build manufacturing toolchain image
        shell: bash
        run: |
          set -euxo pipefail
          docker build -t hardware-devops-toolchain:prusaslicer-2.9.5 toolchain/

      - name: Validate toolchain contract
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            hardware-devops-toolchain:prusaslicer-2.9.5 \
            bash -lc '
              set -euxo pipefail
              prusa-slicer --version
              openscad --version
              prusa-slicer --help > /tmp/prusa-help.txt
              grep -E -q -- "--printer-profile|--print-profile|--material-profile" /tmp/prusa-help.txt
            '

      - name: Run canonical build pipeline in toolchain container
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            hardware-devops-toolchain:prusaslicer-2.9.5 \
            bash scripts/build-model.sh

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-copilot-display-stand-artifacts
          path: |
            artifacts/
            reports/
          if-no-files-found: error
