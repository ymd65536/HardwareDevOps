[vendor]
repo_id = hardware-devops-fff
name = Hardware DevOps
config_version = 2.0.0
config_update_url = https://example.invalid/HardwareDevOps

[printer:*common*]
printer_technology = FFF
gcode_flavor = marlin
bed_shape = 0x0,220x0,220x220,0x220
bed_temperature = 60
extruder_offset = 0x0
extruder_clearance_radius = 65
extruder_clearance_height = 20
machine_limits_usage = time_estimate_only
max_print_height = 220
min_layer_height = 0.12
max_layer_height = 0.4
nozzle_diameter = 0.4
printer_notes = "Home FDM calibration profile for CI validation. This is a minimal manufacturing metadata profile, not a guarantee of print safety."
retract_before_travel = 2
retract_length = 0.8
retract_speed = 35
deretract_speed = 35
retract_lift = 0.2
retract_layer_change = 1
travel_speed = 180
first_layer_speed = 25
perimeter_speed = 60
small_perimeter_speed = 35
external_perimeter_speed = 50
infill_speed = 80
solid_infill_speed = 70
top_solid_infill_speed = 60
support_material_speed = 50
slowdown_below_layer_time = 10
start_gcode = "G28 ; home all axes\nG1 Z5 F3000 ; lift nozzle\nM104 S[first_layer_temperature] ; set nozzle temp\nM140 S[first_layer_bed_temperature] ; set bed temp\nM190 S[first_layer_bed_temperature] ; wait bed\nM109 S[first_layer_temperature] ; wait nozzle\nG92 E0\nG1 E3 F200\nG92 E0"
end_gcode = "M104 S0 ; turn off hotend\nM140 S0 ; turn off bed\nG91 ; relative positioning\nG1 E-2 F300 ; retract filament\nG1 Z5 F3000 ; lift nozzle\nG90 ; absolute positioning\nM84 ; disable motors"

[print:*common*]
avoid_crossing_perimeters = 0
bed_shape = 0x0,220x0,220x220,0x220
bottom_fill_pattern = monotonic
bottom_solid_layers = 4
bridge_flow_ratio = 1
bridge_speed = 80
brim_width = 0
clip_multipart_objects = 0
complete_objects = 0
external_perimeter_extrusion_width = 0.45
external_perimeters_first = 0
extra_perimeters = 1
fill_density = 15%
fill_pattern = rectilinear
first_layer_height = 0.2
first_layer_speed = 25
gap_fill_speed = 40
infill_every_layers = 1
infill_extruder = 1
infill_overlap = 25%
infill_speed = 80
infill_pattern = rectilinear
layer_height = 0.2
max_print_speed = 150
notes = "Minimal print profile for Home FDM. Provides slicer metadata, not manufacturing safety validation."
only_retract_when_crossing_perimeters = 0
output_filename_format = [input_filename_base].gcode
perimeters = 3
perimeter_speed = 60
post_process = 
print_settings_id = 
raft_layers = 0
resolution = 0
seam_position = nearest
skirt_distance = 6
skirt_height = 1
skirts = 1
solid_infill_below_area = 70
solid_infill_every_layers = 0
solid_infill_speed = 70
support_material = 0
support_material_threshold = 0
support_material_with_sheath = 1
top_fill_pattern = monotonic
top_solid_infill_speed = 60
top_solid_layers = 4
travel_speed = 180
threads = 12
wipe_tower = 0
xy_size_compensation = 0

[print:0.20mm Standard @Home FDM]
inherits = *common*

[printer:Home FDM]
inherits = *common*
printer_model = Home FDM
printer_variant = 0.4
default_filament_profile = Generic PLA @Home FDM
default_print_profile = 0.20mm Standard @Home FDM
